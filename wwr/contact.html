<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="This website is about water rafting for a company, come visit us and feel how good it is to drive down to the river with all your friends">
    <meta name="author" content="Samuel Rendón">
    <link rel="stylesheet" href="styles/rafting.css">
    <title>Contact Us - waterafting</title>
</head>

<body>
    <header>
        <img src="images/z-wwr-blue.jpg" alt="Logo">
        <nav>
            <ul class="menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>

    </header>
    <main>
        <div class="mainwater">
            <h1>White Water Rafting Company</h1>
            <p>123 Main River Street<br>Kolob, California</p>
            <p>+1 9998735678</p>
            <p>info@whitewater.com</p>
        </div>
        <div class="contacto">
            <div class="mapa">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d681670.2267581192!2d-111.99946377486354!3d37.470397244747325!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8735a484dbd6b473%3A0x2ae2bd06ceb848e8!2sMonumento%20nacional%20de%20Grand%20Staircase-Escalante!5e0!3m2!1ses!2sco!4v1790896840980!5m2!1ses!2sco"
                  width="450" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
            <section>
                <form class="formulario">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Placeholder">

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Placeholder">

                    <label> Message Purpose </label>
                    <div class="radio-group">
                        <input type="radio" id="general" name="purpose" value="general" checked>
                        <label for="general">General Inquiry</label>
                        <input type="radio" id="reservation" name="purpose" value="reservation">
                        <label for="reservation">Reservation Question</label>
                        <input type="radio" id="suggestion" name="purpose" value="suggestion">
                        <label for="suggestion">Website Suggestion</label>
                    </div>
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Type here"></textarea>
                    <div class="checkbox-group">
                        <input type="checkbox" id="newsletter" name="newsletter" checked>
                        <label for="newsletter">Please Subscribe me to the monthly
                            newsletter</label>
                    </div>
                    <button type="submit">Get in Touch!</button>
                </form>
        </div>
        <h2>We Are Here to Serve You</h2>
        <div class="adventure">
            <figure>
                <img src="images/rafting58_600.jpg" alt="DientesDiablo">
                <figcaption>Los Dientes del Diablo</figcaption>
            </figure>
            <figure>
                <img src="images/rafting65_600.jpg" alt="BigMallard">
                <figcaption>Big Mallard</figcaption>
            </figure>
            <figure>
                <img src="images/rafting43_600.jpg" alt="HalfDay">
                <figcaption>Half Day Adventure</figcaption>
            </figure>
            </section>
    </main>
    <footer>
        <p>©|2026|WATERAFTING|Samuel Rendon</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook-square.svg" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin-square.svg" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram-square.svg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
